<app-login-reg title="Administratorska prijava">
  <div class="admin-badge">ZAŠTIĆENI PRISTUP</div>
  <form class="auth-form" #adminForm="ngForm" (ngSubmit)="submit()" novalidate>
    <div class="field">
      <label for="admin-username">Korisničko ime</label>
      <input id="admin-username" type="text" name="username" [(ngModel)]="username" #usernameControl="ngModel" required autocomplete="username" placeholder="Unesite administratorsko ime">
      @if(usernameControl.touched && usernameControl.invalid) {
        <p class="field-error">Korisničko ime je obavezno.</p>
      }
    </div>
    <div class="field">
      <label for="admin-password">Lozinka</label>
      <div class="password-input">
        <input id="admin-password" [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="password" #passwordControl="ngModel" required autocomplete="current-password" placeholder="Unesite lozinku">
        <button class="password-toggle" type="button" (click)="showPassword = !showPassword">{{showPassword ? 'Sakrij' : 'Prikaži'}}</button>
      </div>
      @if(passwordControl.touched && passwordControl.invalid) {
        <p class="field-error">Lozinka je obavezna.</p>
      }
    </div>
    <button class="primary-button" type="submit" [disabled]="loading || adminForm.invalid">{{loading ? 'Prijavljivanje...' : 'Prijavite se'}}</button>
    @if(message) {
      <p class="server-message" [class.server-message--success]="messageType === 'success'">{{message}}</p>
    }
  </form>
</app-login-reg>
