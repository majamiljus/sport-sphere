<app-login-reg title="Postavite novu lozinku">
  <form class="auth-form" #formaPromeneLozinke="ngForm" (ngSubmit)="potvrdi()" novalidate>
    <div class="field">
      <label for="nova-lozinka">Nova lozinka</label>
      <div class="password-input">
        <input id="nova-lozinka" [type]="prikaziLozinku ? 'text' : 'password'" name="lozinka" [(ngModel)]="lozinka" #kontrolaLozinke="ngModel" required minlength="8" maxlength="12" autocomplete="new-password" placeholder="Unesite novu lozinku">
        <button class="password-toggle" type="button" (click)="prikaziLozinku = !prikaziLozinku">{{prikaziLozinku ? 'Sakrij' : 'Prikaži'}}</button>
      </div>
    </div>

    <div class="field">
      <label for="potvrda-nove-lozinke">Ponovite novu lozinku</label>
      <input id="potvrda-nove-lozinke" type="password" name="potvrdaLozinke" [(ngModel)]="potvrdaLozinke" #kontrolaPotvrdeLozinke="ngModel" required autocomplete="new-password" placeholder="Ponovite novu lozinku">
    </div>

    <button class="primary-button" type="submit" [disabled]="ucitavanje || formaPromeneLozinke.invalid">{{ucitavanje ? 'Čuvanje...' : 'Sačuvajte novu lozinku'}}</button>

    @if(poruka) {
      <p class="server-message" [class.server-message--success]="tipPoruke === 'success'">{{poruka}}</p>
    }

    <p class="form-footer"><a routerLink="/">Nazad na prijavljivanje</a></p>
  </form>
</app-login-reg>
