<div class="page-shell">
  <app-public-header></app-public-header>
  <main class="auth-page-content">
    <app-login-reg title="Zaboravljena lozinka">
      <form class="auth-form" #forgotPasswordForm="ngForm" (ngSubmit)="submit()" novalidate>
        <div class="field">
          <label for="identifikator">Korisničko ime ili imejl adresa</label>
          <input id="identifikator" type="text" name="identifikator" [(ngModel)]="identifikator" #identifierControl="ngModel" required autocomplete="username" placeholder="Unesite korisničko ime ili imejl adresu">
          @if(identifierControl.touched && identifierControl.invalid) {
            <p class="field-error">Korisničko ime ili imejl adresa su obavezni.</p>
          }
        </div>
        <div class="info-box">Link za postavljanje nove lozinke važi 30 minuta.</div>
        <button class="primary-button" type="submit" [disabled]="loading || forgotPasswordForm.invalid">{{loading ? 'Slanje...' : 'Pošaljite privremeni link'}}</button>
        @if(message) {
          <p class="server-message" [class.server-message--success]="messageType === 'success'">{{message}}</p>
        }
        <p class="form-footer"><a routerLink="/">Nazad na prijavljivanje</a></p>
      </form>
    </app-login-reg>
  </main>
  <app-public-footer></app-public-footer>
</div>
